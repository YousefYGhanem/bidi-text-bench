# Candidate audit targets for the v1 audit.
# In task 5.1, Claude verifies each one: does it run locally or is the page public,
# what is the current version and report channel, and is there a terms-of-service note.
# mode:
#   auto-chat — self-hosted open-source UI pointed at the mock LLM
#   auto-page — public page, no login, low rate
#   manual    — human protocol only (docs/AUDIT_PROTOCOL.md §4)
# Never put credentials in this file.

# --- Open-source AI chat UIs (self-hosted in Docker, automated) ---
- id: open-webui
  name: Open WebUI
  mode: auto-chat
  repo: https://github.com/open-webui/open-webui
