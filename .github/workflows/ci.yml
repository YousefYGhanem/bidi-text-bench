name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    # Playwright tests in the project image (Noto fonts, all three engines), same as `npm run docker:test` locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run docker:test
