name: Bug
description: Something in bidi-text-bench itself is broken (not a false positive)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci
        2. npm run …
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, browser, bidi-text-bench commit, and whether you ran in Docker.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
