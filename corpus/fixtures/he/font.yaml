- id: he-font-002
  lang: he
  category: FONT
  title: 'Geresh, gershayim and maqaf next to Latin text'
  text: 'הפגישה בת״א ביום ב׳ היא על ה־API החדש.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message]
  severity: minor
  expected_notes: >-
    The text uses gershayim U+05F4 in "ת״א", geresh U+05F3 in "ב׳" and maqaf U+05BE in "ה־API". All
    three render as Hebrew punctuation with no tofu. The maqaf joins "ה" to "API" at mid-height, and
    "API" reads left to right. The maqaf U+05BE before a Latin word is correct Hebrew typography, so
    "ה־API" as typed is right; the ASCII hyphen is also common in casual typing.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-24T13:54:33.923Z', hash: '6dedc36012e0bb3723179d75d8640ef44ceeaeb35cbeef31f543b83d0a865523' }
  source: original
  related_issues: []

