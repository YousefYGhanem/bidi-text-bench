- id: he-bd-001
  lang: he
  category: BD
  title: Hebrew sentence that starts with an English library name
  text: 'React היא ספרייה לבניית ממשקי משתמש, ומשתמשים בה בהרבה חברות.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message, input, stream]
  severity: major
  expected_notes: >-
    The whole paragraph runs right-to-left and is right-aligned. "React" is the first word, at the far
    right. The comma follows "משתמש" and the final period is at the far left. First-strong detection
    (dir="auto") gets this wrong.
  status: draft
  verification: null
  source: original
  related_issues: []

