# he AL fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: he-al-001
  lang: he
  category: AL
  title: 'Two-sentence Hebrew travel question must be right-aligned'
  text: 'שלום, אני מחפש מלון קטן ליד הים לסוף השבוע. יש לכם המלצה?'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message, input]
  severity: minor
  expected_notes: >-
    The text is aligned to the right edge of its container (text-align: start in an RTL paragraph,
    not left). Reading right to left, the first sentence ends with a period and the question mark is
    at the far left of the last line.
  status: draft
  verification: null
  source: original
  related_issues: []

