# he COPY fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: he-copy-001
  lang: he
  category: COPY
  title: 'Copy a sentence with an inline command and a digit'
  text: 'הריצו `npm test` על 3 מכונות שונות.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['npm test']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    Manual check. Select the whole sentence, copy it and paste it into a plain-text editor. The
    pasted text must equal the logical text: same word order, no reversed words, and no added bidi
    controls (such as U+200E, U+200F or U+2066 to U+2069). Selecting across the command must not
    skip or duplicate characters. NEEDS-YOUSEF: should the pasted text keep the backticks, or only
    the command?
  status: draft
  verification: null
  source: original
  related_issues: []

