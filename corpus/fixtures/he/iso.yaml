# he ISO fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: he-iso-001
  lang: he
  category: ISO
  title: Relative folder path with leading ./ and trailing slash, inside inline code
  text: 'שמרו את הדוחות בתיקייה `./reports/` והריצו שוב את הבדיקות.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['./reports/']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    The path appears exactly as typed, as one left-to-right unit: ./reports/, with "./" at its left
    end and "/" at its right end. If the code span is not isolated, the leading "./" and the trailing
    "/" jump to the opposite sides.
  status: draft
  verification: null
  source: original
  related_issues: []

- id: he-iso-002
  lang: he
  category: ISO
  title: 'Auto-linked URL followed by a period'
  text: 'הנה הקישור לתיעוד: https://example.com/docs/api?lang=he. תקראו אותו לפני שמתחילים.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['https://example.com/docs/api?lang=he']
  author_spans: []
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    The URL is one left-to-right unit that reads exactly https://example.com/docs/api?lang=he. The
    period after it is not part of the link; it sits visually to the left of the URL. The URL must
    not be reordered at its slashes or at the "?".
  status: draft
  verification: null
  source: original
  related_issues: []

- id: he-iso-003
  lang: he
  category: ISO
  title: 'Email address after the prefix ל-'
  text: 'כתבו לנו ל-support@example.com ונחזור אליכם עד מחר.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['support@example.com']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    The address reads support@example.com as one left-to-right unit. Reading right to left: "כתבו
    לנו", the prefix "ל-", the address, then "ונחזור אליכם עד מחר.". The hyphen stays between the
    prefix and the address. NEEDS-YOUSEF: is "ל-" directly before an email natural, or would you
    write it differently?
  status: draft
  verification: null
  source: original
  related_issues: []

- id: he-iso-004
  lang: he
  category: ISO
  title: 'Mention with a leading @ in a code-review comment'
  text: 'תודה @noam-dev על ה-PR, אפשר למזג אותו.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['@noam-dev']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    The mention is one left-to-right unit, "@noam-dev", with "@" at its left end. Reading right to
    left: "תודה", the mention, "על", "ה-PR", then "אפשר למזג אותו" with the period at the far left.
    The "@" must not jump to the right of "noam-dev".
  status: draft
  verification: null
  source: original
  related_issues: []

