- id: he-num-004
  lang: he
  category: NUM
  title: 'Phone number with plus sign and hyphens'
  text: 'התקשרו למספר +972-50-000-0000 והזכירו את מספר ההזמנה.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: ['+972-50-000-0000']
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    The number reads +972-50-000-0000 as one left-to-right unit, with the plus sign at its left end,
    and the final period is at the far left. The number is an author span: in plain text UAX #9 draws
    the plus sign at the right end, and only author markup (LRI/PDI, an LRM before "+", or backticks)
    fixes that. UIs are not penalised for the plus sign; the digit groups must still keep their order.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T12:57:40.423Z', hash: '7c0ea099f022a6aa59873dccc7efee70f5603831717dd54e73eec8189e3d9222' }
  source: original
  related_issues: []
