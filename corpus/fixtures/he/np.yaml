- id: he-np-003
  lang: he
  category: NP
  title: 'Quoted English string and nested punctuation at the end'
  text: 'הוא כתב "Hello World" בקונסולה (וזה עבד!).'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    Reading right to left: "הוא כתב", the quoted string, "בקונסולה", then the bracketed part. Inside
    the quotes "Hello World" reads left to right. The brackets enclose "וזה עבד!" and are mirrored
    correctly; the exclamation mark and the final period are at the far left, in that order.
    NEEDS-YOUSEF: are straight ASCII quotes acceptable in Hebrew text here, or should the fixture
    use typographic quotes?
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:46:21.922Z', hash: '773e3bcb1dd0a66610aa955866fea6f516d696d62bbdf62082521df3bca02294' }
  source: original
  related_issues: []

