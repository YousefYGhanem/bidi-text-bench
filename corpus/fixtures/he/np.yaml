# he NP fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: he-np-001
  lang: he
  category: NP
  title: Question ending with a prefixed English word
  text: 'האם זה עובד גם ב-Windows?'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message, input]
  severity: major
  expected_notes: >-
    Reads right-to-left. The prefix reads "ב-Windows": "ב" on the right, then the hyphen, then
    "Windows". The question mark is at the far left, just left of "Windows". If the base direction is
    wrong, the "?" lands at the far right.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:45:59.848Z', hash: '9b0144b728ce148373b5091b7fe868a38be7ee67a43aa07ca99d58ea90bdd1fa' }
  source: original
  related_issues: []

- id: he-np-002
  lang: he
  category: NP
  title: Plain-text C++ after a Hebrew prefix (author-owned span)
  text: 'אני כותב קוד ב-C++ כבר חמש שנים.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: ['C++']
  surfaces: [message]
  severity: major
  expected_notes: >-
    In plain text, UAX #9 shows "++C", because the plus signs take the paragraph direction. Correct
    display needs author markup: an LRM after "C++", or backticks. UIs are not penalised on this
    span, but base direction and alignment are still checked. Track B checks whether models write
    it safely.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:46:01.131Z', hash: '2610c62e62c30932ee86368ee627ff5edd2adf731785204a1b6f3b8eda754a06' }
