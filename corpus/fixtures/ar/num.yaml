- id: ar-num-003
  lang: ar
  category: NUM
  title: Arabic-Indic digits for order number, amount and date
  text: 'رقم الطلب ١٢٣٤، والمبلغ ٤٩٫٩٠ دولارًا، والتاريخ ٣١/١٢/٢٠٢٦.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    Every number keeps its digit order: ١٢٣٤, ٤٩٫٩٠ (with the Arabic decimal separator) and the date
    ٣١/١٢/٢٠٢٦ (day/month/year). The slashes stay between the date parts. The digits are not
    replaced by Western digits. Arabic-Indic digits are a natural choice for a support message like
    this, and the decimal separator ٫ (U+066B) is right, so no comma is expected.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-24T13:54:19.040Z', hash: '2ab27589be3f8cff356df83fa82b3b7dc2abd1a9222c6ee9161cec4cb9554f7b' }
  source: original
  related_issues: []

- id: ar-num-004
  lang: ar
  category: NUM
  title: International phone number and a version number
  text: 'اتصل بنا على +1-555-000-0000 بعد التحديث إلى الإصدار v2.4.1.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: ['+1-555-000-0000']
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    The phone number reads +1-555-000-0000 as one left-to-right unit, with the plus sign at its left
    end. The version reads v2.4.1 left-to-right, and the final period is at the far left. The phone
    number is an author span: in plain text UAX #9 draws the plus sign at the right end, and only
    author markup (LRI/PDI, an LRM before "+", or backticks) fixes that. UIs are not penalised for the
    plus sign; the digit groups must still keep their order.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T12:57:39.535Z', hash: '8ca438c624737b862d301e85a35909cd976c77888f0aeff9a031f45fca5adb7c' }
  source: original
  related_issues: []
