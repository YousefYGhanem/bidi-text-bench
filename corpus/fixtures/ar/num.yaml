# ar NUM fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: ar-num-001
  lang: ar
  category: NUM
  title: Price, percentage and date in one sentence
  text: 'سعر الاشتراك 49.90 دولارًا شهريًا، مع خصم 20% حتى 31/12/2026.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    Every number keeps its internal left-to-right order: 49.90, 20%, 31/12/2026 (day/month/year).
    The final period is at the far left. Reordered digits or date parts change the meaning (blocker).
    As typed, the % sits to the right of 20 ("20%"), which is what Arabic readers expect with
    Western digits.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-24T13:54:16.209Z', hash: '86cc8880f40ef56c2809ab95ec39d4331799f450ed57d3a0ab08d2a7cd73657a' }
  source: original
  related_issues: []

- id: ar-num-002
