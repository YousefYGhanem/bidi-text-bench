  category: NUM
  title: Price, percentage and date in one sentence
  text: 'سعر الاشتراك 49.90 دولارًا شهريًا، مع خصم 20% حتى 31/12/2026.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    Every number keeps its internal left-to-right order: 49.90, 20%, 31/12/2026 (day/month/year).
