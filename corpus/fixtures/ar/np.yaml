- id: ar-np-002
  lang: ar
  category: NP
  title: Guillemets around Latin commands and an Arabic question mark
  text: 'هل تقصد «git rebase» أم «git merge»؟'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message, input]
  severity: major
  expected_notes: >-
    Reads right-to-left: "هل تقصد", then «git rebase» as a left-to-right unit, "أم", then «git merge»,
    and the question mark at the far left. Each pair of guillemets encloses its command: the opening
    mark on its right and the closing mark on its left. Mirroring of the quote glyphs is checked by
    eye. Arabic readers expect « » here, so the guillemets as typed are correct; straight double
    quotes would also be understood.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-24T13:54:11.920Z', hash: '042b4c990c914248ed1503eb0d0f25b5586e6656872a8de42e8bdc2e0e77a350' }
  source: original
  related_issues: []

