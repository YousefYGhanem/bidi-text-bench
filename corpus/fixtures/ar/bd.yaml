  text: '3 أشياء لازم تعرفها عن الـ API قبل ما تربطه بالتطبيق: المفتاح، والحد الأقصى للطلبات، ورقم النسخة.'
  markdown: false
  base_direction: rtl
  isolate_spans: []
  author_spans: []
  surfaces: [message, stream]
  severity: major
  expected_notes: >-
    The paragraph is right-to-left from the first chunk to the last: "3" at the far right, then the
    Arabic words leftwards. "API" reads left-to-right inside the sentence. The colon follows
    "بالتطبيق" and the final period is at the far left. While streaming, the layout must not flip
    from LTR to RTL once Arabic words arrive. A leading digit is weak, so first-strong detection
    on the first chunk finds no direction.
