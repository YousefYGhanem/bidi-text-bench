# ar ISO fixtures (docs/FIXTURE_SPEC.md). Drafts are reviewed with npm run review.

- id: ar-iso-001
  lang: ar
  category: ISO
  title: Windows folder path ending in a backslash, inside inline code
  text: 'افتح المجلد `C:\Users\demo\reports\` ثم احذف النسخ القديمة.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['C:\Users\demo\reports\']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    The path appears exactly as typed, as one left-to-right unit: C:\Users\demo\reports\ with the
    trailing backslash at its right end. If the code span is not isolated, the trailing backslash
    jumps to the left of "C:". That misleads anyone who reads or retypes the path.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:43:19.051Z', hash: 'acee1a0b4ad2b86de502bc1894d1ef7e40a7549095c299db5dc4ac18eb7c4b9b' }
  source: original
  related_issues: []

- id: ar-iso-002
  lang: ar
  category: ISO
  title: Auto-linked URL inside parentheses
  text: 'راجع الدليل (https://example.com/docs/setup) قبل التثبيت.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['https://example.com/docs/setup']
  author_spans: []
  surfaces: [message]
  severity: major
  expected_notes: >-
    The URL reads left-to-right as one unit. The parentheses surround it: the opening one at its
    right, the closing one at its left, and neither is pulled inside the URL. The final period is at
    the far left, after "التثبيت". Unisolated links let the ")" jump to the wrong side of the URL.
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:43:20.455Z', hash: 'd77faaafcd4db3cb5a4448f1cc56dcbe18ab9262934052f836dc260c1ca61895' }
  source: original
  related_issues: []

