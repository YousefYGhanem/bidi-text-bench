- id: ar-iso-004
  lang: ar
  category: ISO
  title: Mention and absolute file path in inline code
  text: 'شكرًا @sami، عدّلت الملف `/etc/nginx/nginx.conf` وأعدت تشغيل الخدمة.'
  markdown: true
  base_direction: rtl
  isolate_spans: ['@sami', '/etc/nginx/nginx.conf']
  author_spans: []
  surfaces: [message]
  severity: blocker
  expected_notes: >-
    "@sami" reads as one unit with "@" at its left end, and the Arabic comma is to its left. The path
    reads exactly /etc/nginx/nginx.conf, left-to-right, with the leading slash at its left. An
    unisolated path shows the leading slash jumping to the end, which makes it a different path.
    NEEDS-YOUSEF: not every UI renders @sami as a mention in plain Markdown. Keep it as a span?
  status: verified
  verification: { by: 'Yousef Ghanem', at: '2026-10-23T11:43:23.856Z', hash: '00d9b1dd558dcb3efa42613562bdd519058caa83ae8c301f2ba97cb39ff2ce50' }
  source: original
  related_issues: []

